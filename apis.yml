aid: leaf4life
name: LEAF4Life
description: >-
  LEAF4Life Inc. is a privately held, clinical-stage biopharmaceutical company headquartered in Woburn,
  Massachusetts, founded in 2018 by Dr. Clet Niyikiza to develop transformative therapies for hypoxia —
  insufficient oxygen at the tissue and cellular level — which the company describes as implicated in the
  world's ten leading causes of death and more than 30 million deaths a year. Its lead asset, KizaVie™
  (LEAF-4L6715), is a proprietary liposomal formulation of transcrocetin, a naturally occurring carotenoid
  from saffron and cape jasmine, designed to enhance oxygen diffusion in plasma and interstitium, restore
  microcirculatory oxygen delivery and repair hypoxia-driven microvascular and tissue damage, thereby
  improving the effectiveness of standard-of-care treatment. KizaVie™ is in three Phase 3 registrational
  studies in Europe — acute respiratory distress syndrome (ARDS), glioblastoma and sarcoma — and has
  received Compassionate Use Authorization in France for ARDS. The company also describes application to
  shock and trauma, cardiovascular disease, neurodegenerative disorders and aging. LEAF4Life runs no
  developer program and publishes no product API, developer portal, API reference, SDK or OpenAPI
  definition. The only machine-readable surface reachable without credentials is the WordPress REST
  content API behind leafforlife.com, catalogued here, and even that returns page identity and media only —
  every page body is empty over the API because the site is assembled by a page builder.
