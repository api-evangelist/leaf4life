  api_key_in: []
  oauth2_flows: []
  public_read: true
note: >-
  The LEAF4Life content API declares no security schemes and requires no credentials for any operation
  catalogued in this repo. LEAF4Life runs no developer program and publishes no authentication
  documentation, because there is no product API to authenticate against — the read surface is simply
  open. The one authentication mechanism the deployment advertises for discovery is WordPress
  application passwords (HTTP Basic over TLS), announced in the `authentication` block of the route
  index and pointing at the wp-admin authorization screen. That mechanism exists for the site's own
  editors; it is not an API credential a third party can obtain, and no attempt was made to use it.
schemes:
- id: applicationPassword
  type: http
  scheme: basic
  in: header
  header: Authorization
  provider_advertised: true
  obtainable_by_third_party: false
  authorization_endpoint: https://leafforlife.com/wp-admin/authorize-application.php
  detail: >-
    Declared verbatim by the route index as
    authentication.application-passwords.endpoints.authorization. WordPress application passwords are
    per-user credentials issued from the site's own admin screen to an already-authenticated editor.
    There is no self-service registration, no client-credentials grant, no key issuance and no
    developer signup, so this cannot be treated as a public API authentication scheme. It is recorded
    because it is what the provider actually publishes.
